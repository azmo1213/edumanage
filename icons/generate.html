<!DOCTYPE html><html><body>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  ctx.fillStyle = '#4F46E5';
  ctx.beginPath();
  ctx.roundRect(0,0,s,s,s*0.2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold ' + (s*0.55) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('E', s/2, s/2);
  const a = document.createElement('a');
  a.download = 'icon-' + s + '.png';
  a.href = canvas.toDataURL();
  document.body.appendChild(a);
  a.click();
}
window.onload = function() {
  setTimeout(()=>drawIcon(document.getElementById('c192')),300);
  setTimeout(()=>drawIcon(document.getElementById('c512')),600);
};
</script>
</body></html>
